name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-sbcl:
    name: SBCL ${{ matrix.os }} ${{ matrix.sbcl-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            sbcl-version: release
          - os: macos-latest
            sbcl-version: release
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install SBCL (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install sbcl

    - name: Install SBCL (macOS)
      if: runner.os == 'macOS'
      run: brew install sbcl

    - name: Install Quicklisp
      run: |
        curl -O https://beta.quicklisp.org/quicklisp.lisp
        sbcl --non-interactive \
          --load quicklisp.lisp \
          --eval '(quicklisp-quickstart:install)'

    - name: Run CFFI tests
      run: |
        ln -s $PWD ~/quicklisp/local-projects/cffi
        sbcl --non-interactive \
          --load ~/quicklisp/setup.lisp \
          --eval '(ql:quickload :trivial-features)' \
          --eval '(ql:quickload :cffi-tests)' \
          --eval '(let ((failures (remove (quote string.encodings.all.basic) (cffi-tests:run-all-cffi-tests)))) (sb-ext:exit :code (if failures 1 0)))'

  test-sbcl-source:
    name: SBCL from source (Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
      with:
        path: cffi

    - name: Checkout SBCL
      uses: actions/checkout@v4
      with:
        repository: jbouwman/sbcl
        ref: srbv-stack-3-macro
        path: sbcl

    - name: Install host SBCL and dependencies
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install sbcl libcapstone-dev libzstd-dev

    - name: Build SBCL
      working-directory: sbcl
      env:
        SBCL_MAKE_TARGET_2_OPTIONS: --disable-ldb --disable-debugger
      run: |
        ./make.sh --with-sb-core-compression --xc-host='sbcl --dynamic-space-size 700MB --lose-on-corruption --disable-ldb --disable-debugger'

    - name: Install SBCL
      working-directory: sbcl
      run: sudo ./install.sh

    - name: Verify SBCL installation
      run: sbcl --version

    - name: Install Quicklisp
      run: |
        curl -O https://beta.quicklisp.org/quicklisp.lisp
        sbcl --non-interactive \
          --load quicklisp.lisp \
          --eval '(quicklisp-quickstart:install)'

    - name: Run CFFI tests
      run: |
        ln -s $PWD/cffi ~/quicklisp/local-projects/cffi
        sbcl --non-interactive \
          --load ~/quicklisp/setup.lisp \
          --eval '(ql:quickload :trivial-features)' \
          --eval '(ql:quickload :cffi-tests)' \
          --eval '(let ((failures (remove (quote string.encodings.all.basic) (cffi-tests:run-all-cffi-tests)))) (sb-ext:exit :code (if failures 1 0)))'
